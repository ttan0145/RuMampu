name: Neon Database Backup

on:
  schedule:
    - cron: "15 2 * * *"
      timezone: "Asia/Kuala_Lumpur"
  workflow_dispatch:
  # Also exercise the workflow when its implementation changes. Ordinary
  # application pushes do not create unnecessary database backups.
  push:
    branches: [main]
    paths:
      - ".github/workflows/database-backup.yml"
      - "backend/scripts/database_counts.py"

permissions:
  contents: read

concurrency:
  group: neon-database-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Dump Neon and upload to Backblaze B2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Validate backup configuration
        shell: bash
        run: |
          set -euo pipefail

          declare -A secret_names=(
            [DATABASE_URL]=NEON_DATABASE_URL
            [AWS_ACCESS_KEY_ID]=B2_KEY_ID
            [AWS_SECRET_ACCESS_KEY]=B2_APPLICATION_KEY
            [B2_BUCKET]=B2_BUCKET
            [B2_ENDPOINT]=B2_ENDPOINT
            [NEON_API_KEY]=NEON_API_KEY
            [NEON_PROJECT_ID]=NEON_PROJECT_ID
          )
          missing=()
          for variable in DATABASE_URL AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY B2_BUCKET B2_ENDPOINT NEON_API_KEY NEON_PROJECT_ID; do
            if [[ -z "${!variable:-}" ]]; then
              missing+=("${secret_names[$variable]}")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi

          if [[ ! "$DATABASE_URL" =~ ^postgres(ql)?:// ]]; then
            echo "::error::NEON_DATABASE_URL must be a PostgreSQL connection URL."
            exit 1
          fi

          if [[ ! "$B2_ENDPOINT" =~ ^https://s3\.([a-z0-9-]+)\.backblazeb2\.com/?$ ]]; then
            echo "::error::B2_ENDPOINT must look like https://s3.<region>.backblazeb2.com"
            exit 1
          fi

          echo "Configuration is present and has the expected format."

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Create disposable Neon restore branch
        id: restore-branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch_name: integrity/restore-${{ github.run_id }}-${{ github.run_attempt }}
          api_key: ${{ env.NEON_API_KEY }}

      - name: Install backup tools
        shell: bash
        run: |
          set -euo pipefail

          # GitHub-hosted runners normally include AWS CLI v2. Install it from
          # Amazon only when the image does not already provide it.
          if ! command -v aws >/dev/null 2>&1; then
            if ! command -v unzip >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install --yes unzip
            fi
            installer_zip="${RUNNER_TEMP}/awscliv2.zip"
            installer_dir="${RUNNER_TEMP}/aws-cli-installer"
            curl --fail --silent --show-error --location \
              "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" \
              --output "$installer_zip"
            unzip -q "$installer_zip" -d "$installer_dir"
            sudo "$installer_dir/aws/install"
          fi

          aws --version
          docker --version
          docker pull postgres:18
          docker run --rm postgres:18 pg_dump --version

      - name: Create database backup
        id: dump
        shell: bash
        run: |
          set -euo pipefail

          timestamp="$(TZ=Asia/Kuala_Lumpur date +'%Y-%m-%d-%H%M%S')"
          backup_file="${RUNNER_TEMP}/rumampu-${timestamp}.dump"
          backup_name="$(basename "$backup_file")"

          # Neon currently runs PostgreSQL 18, while Ubuntu 24.04 packages an
          # older client. Use the matching official client so pg_dump never
          # aborts because the server major version is newer.
          docker run --rm \
            --env DATABASE_URL \
            --env BACKUP_NAME="$backup_name" \
            --volume "${RUNNER_TEMP}:/backup" \
            postgres:18 \
            sh -ceu 'pg_dump "$DATABASE_URL" \
              --format=custom \
              --no-owner \
              --no-acl \
              --file="/backup/$BACKUP_NAME"'

          if [[ ! -s "$backup_file" ]]; then
            echo "::error::pg_dump completed without producing a non-empty backup."
            exit 1
          fi

          object_key="database/${backup_name}"
          echo "file=$backup_file" >> "$GITHUB_OUTPUT"
          echo "name=$backup_name" >> "$GITHUB_OUTPUT"
          echo "key=$object_key" >> "$GITHUB_OUTPUT"
          echo "Created ${backup_name} ($(du -h "$backup_file" | cut -f1))."

      - name: Upload backup to Backblaze B2
        shell: bash
        env:
          BACKUP_FILE: ${{ steps.dump.outputs.file }}
          OBJECT_KEY: ${{ steps.dump.outputs.key }}
        run: |
          set -euo pipefail

          endpoint="${B2_ENDPOINT%/}"
          region="${endpoint#https://s3.}"
          region="${region%.backblazeb2.com}"
          export AWS_DEFAULT_REGION="$region"

          aws s3 cp "$BACKUP_FILE" "s3://${B2_BUCKET}/${OBJECT_KEY}" \
            --endpoint-url "$endpoint" \
            --only-show-errors

      - name: Verify uploaded backup
        shell: bash
        env:
          OBJECT_KEY: ${{ steps.dump.outputs.key }}
          BACKUP_NAME: ${{ steps.dump.outputs.name }}
        run: |
          set -euo pipefail

          endpoint="${B2_ENDPOINT%/}"
          region="${endpoint#https://s3.}"
          region="${region%.backblazeb2.com}"
          export AWS_DEFAULT_REGION="$region"

          size="$(aws s3api head-object \
            --bucket "$B2_BUCKET" \
            --key "$OBJECT_KEY" \
            --endpoint-url "$endpoint" \
            --query ContentLength \
            --output text)"

          if [[ ! "$size" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Backblaze returned an invalid object size: $size"
            exit 1
          fi

          echo "Backup verified: s3://${B2_BUCKET}/${OBJECT_KEY} (${size} bytes)"
          echo "Backup file: ${BACKUP_NAME}"

      - name: Restore backup and compare every table with production
        working-directory: backend
        env:
          BACKUP_FILE: ${{ steps.dump.outputs.file }}
          PRODUCTION_DATABASE_URL: ${{ env.DATABASE_URL }}
          RESTORE_DATABASE_URL: ${{ steps.restore-branch.outputs.db_url }}
        run: |
          DATABASE_URL="$PRODUCTION_DATABASE_URL" python scripts/database_counts.py snapshot "${RUNNER_TEMP}/production-counts.json"
          docker run --rm \
            --env RESTORE_DATABASE_URL \
            --env BACKUP_NAME="$(basename "$BACKUP_FILE")" \
            --volume "${RUNNER_TEMP}:/backup" \
            postgres:18 \
            sh -ceu 'pg_restore \
              --clean \
              --if-exists \
              --no-owner \
              --no-acl \
              --dbname="$RESTORE_DATABASE_URL" \
              "/backup/$BACKUP_NAME"'
          DATABASE_URL="$RESTORE_DATABASE_URL" python scripts/database_counts.py snapshot "${RUNNER_TEMP}/restore-counts.json"
          python scripts/database_counts.py compare \
            "${RUNNER_TEMP}/production-counts.json" \
            "${RUNNER_TEMP}/restore-counts.json" \
            --exact-tables

      - name: Remove temporary backup copy
        if: always()
        env:
          BACKUP_FILE: ${{ steps.dump.outputs.file }}
        run: |
          if [[ -n "${BACKUP_FILE:-}" && -f "$BACKUP_FILE" ]]; then
            rm -f -- "$BACKUP_FILE"
          fi

      - name: Delete disposable Neon restore branch
        if: always() && steps.restore-branch.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch: ${{ steps.restore-branch.outputs.branch_id }}
          api_key: ${{ env.NEON_API_KEY }}
