name: Neon Database Backup

on:
  schedule:
    - cron: "15 2 * * *"
      timezone: "Asia/Kuala_Lumpur"

  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create database backup
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          BACKUP_FILE="rumampu-$(date +'%Y-%m-%d-%H%M%S').dump"

          pg_dump "$DATABASE_URL" \
            --format=custom \
            --no-owner \
            --no-acl \
            --file="$BACKUP_FILE"

          echo "BACKUP_FILE=$BACKUP_FILE" >> "$GITHUB_ENV"

      - name: Upload backup to Backblaze B2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
        run: |
          aws s3 cp "$BACKUP_FILE" \
            "s3://$B2_BUCKET/database/$BACKUP_FILE" \
            --endpoint-url "$B2_ENDPOINT"

      - name: Confirm backup
        run: |
          echo "Backup uploaded successfully:"
          echo "$BACKUP_FILE"