name: Production database migrations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/database-migrate.yml"
      - "backend/**/migrations/*.py"

permissions:
  contents: read

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Back up Neon and apply Django migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Validate and configure the production database
        shell: bash
        run: |
          set -euo pipefail

          declare -A secret_names=(
            [DATABASE_URL]=NEON_DATABASE_URL
            [AWS_ACCESS_KEY_ID]=B2_KEY_ID
            [AWS_SECRET_ACCESS_KEY]=B2_APPLICATION_KEY
            [B2_BUCKET]=B2_BUCKET
            [B2_ENDPOINT]=B2_ENDPOINT
          )
          missing=()
          for variable in DATABASE_URL AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY B2_BUCKET B2_ENDPOINT; do
            if [[ -z "${!variable:-}" ]]; then
              missing+=("${secret_names[$variable]}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi

          if [[ ! "$B2_ENDPOINT" =~ ^https://s3\.([a-z0-9-]+)\.backblazeb2\.com/?$ ]]; then
            echo "::error::B2_ENDPOINT must look like https://s3.<region>.backblazeb2.com"
            exit 1
          fi

          python - <<'PY'
          import os
          from urllib.parse import parse_qs, unquote, urlsplit

          parts = urlsplit(os.environ["DATABASE_URL"])
          if parts.scheme not in {"postgres", "postgresql"} or not parts.hostname:
              raise SystemExit("NEON_DATABASE_URL must be a PostgreSQL connection URL.")

          query = parse_qs(parts.query)
          values = {
              "PGHOST": parts.hostname,
              "PGDATABASE": unquote(parts.path.lstrip("/")),
              "PGUSER": unquote(parts.username or ""),
              "PGPASSWORD": unquote(parts.password or ""),
              "PGPORT": str(parts.port or 5432),
              "PGSSLMODE": query.get("sslmode", ["require"])[0],
          }
          missing = [name for name in ("PGDATABASE", "PGUSER", "PGPASSWORD") if not values[name]]
          if missing:
              raise SystemExit("NEON_DATABASE_URL is missing: " + ", ".join(missing))

          for value in values.values():
              if value:
                  print(f"::add-mask::{value}")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              for name, value in values.items():
                  delimiter = f"RUMAMPU_{name}_VALUE"
                  env_file.write(f"{name}<<{delimiter}\n{value}\n{delimiter}\n")
          PY

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Install backup tools
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v aws >/dev/null 2>&1; then
            if ! command -v unzip >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install --yes unzip
            fi
            installer_zip="${RUNNER_TEMP}/awscliv2.zip"
            installer_dir="${RUNNER_TEMP}/aws-cli-installer"
            curl --fail --silent --show-error --location \
              "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" \
              --output "$installer_zip"
            unzip -q "$installer_zip" -d "$installer_dir"
            sudo "$installer_dir/aws/install"
          fi

          aws --version
          docker --version
          docker pull postgres:18

      - name: Create a pre-migration database backup
        id: backup
        shell: bash
        run: |
          set -euo pipefail

          backup_name="rumampu-pre-migration-${GITHUB_SHA}.dump"
          backup_file="${RUNNER_TEMP}/${backup_name}"
          docker run --rm \
            --env DATABASE_URL \
            --env BACKUP_NAME="$backup_name" \
            --volume "${RUNNER_TEMP}:/backup" \
            postgres:18 \
            sh -ceu 'pg_dump "$DATABASE_URL" \
              --format=custom \
              --no-owner \
              --no-acl \
              --file="/backup/$BACKUP_NAME"'

          test -s "$backup_file"
          object_key="database/${backup_name}"
          echo "file=$backup_file" >> "$GITHUB_OUTPUT"
          echo "name=$backup_name" >> "$GITHUB_OUTPUT"
          echo "key=$object_key" >> "$GITHUB_OUTPUT"

      - name: Upload the pre-migration backup to private Backblaze B2
        shell: bash
        env:
          BACKUP_FILE: ${{ steps.backup.outputs.file }}
          OBJECT_KEY: ${{ steps.backup.outputs.key }}
        run: |
          set -euo pipefail

          endpoint="${B2_ENDPOINT%/}"
          region="${endpoint#https://s3.}"
          region="${region%.backblazeb2.com}"
          export AWS_DEFAULT_REGION="$region"

          aws s3 cp "$BACKUP_FILE" "s3://${B2_BUCKET}/${OBJECT_KEY}" \
            --endpoint-url "$endpoint" \
            --only-show-errors

      - name: Verify the Backblaze backup
        shell: bash
        env:
          OBJECT_KEY: ${{ steps.backup.outputs.key }}
        run: |
          set -euo pipefail

          endpoint="${B2_ENDPOINT%/}"
          region="${endpoint#https://s3.}"
          region="${region%.backblazeb2.com}"
          export AWS_DEFAULT_REGION="$region"

          size="$(aws s3api head-object \
            --bucket "$B2_BUCKET" \
            --key "$OBJECT_KEY" \
            --endpoint-url "$endpoint" \
            --query ContentLength \
            --output text)"
          if [[ ! "$size" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Backblaze returned an invalid object size: $size"
            exit 1
          fi
          echo "Pre-migration backup verified in private Backblaze storage (${size} bytes)."

      - name: Remove the temporary runner copy
        if: always()
        shell: bash
        env:
          BACKUP_FILE: ${{ steps.backup.outputs.file }}
        run: |
          if [[ -n "${BACKUP_FILE:-}" && -f "$BACKUP_FILE" ]]; then
            rm -f -- "$BACKUP_FILE"
          fi

      - name: Show the production migration plan
        working-directory: backend
        run: |
          python manage.py check
          python manage.py showmigrations finance housing
          python manage.py migrate --plan

      - name: Apply production migrations
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Verify all migrations are applied
        working-directory: backend
        run: |
          python manage.py migrate --check
          python manage.py showmigrations finance housing
