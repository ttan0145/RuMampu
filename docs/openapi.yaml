  /api/v1/income/entries/:
    get:
      operationId: income_entries_list
      summary: List income entries
      tags:
      - Income
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IncomeEntry'
          description: ''
    post:
      operationId: income_entries_create
      description: Amounts are decimal strings. A manual amount that is unusually
        high after at least three comparable entries returns 409 until confirm_outlier
        is true.
      summary: Create an income entry
      tags:
      - Income
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncomeEntryCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IncomeEntryCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IncomeEntryCreateRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeEntry'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Explicit confirmation is required for an unusual amount.
  /api/v1/income/entries/{entry_id}/:
