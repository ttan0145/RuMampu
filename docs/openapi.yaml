          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedIncomeEntryUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedIncomeEntryUpdateRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeEntry'
