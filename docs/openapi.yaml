          format: double
      required:
      - closing_balance
      - month
      - year
    StartingLiquidityResult:
      type: object
      properties:
        required_amount:
          type: number
          format: double
          minimum: 0
        months:
          type: array
          items:
            $ref: '#/components/schemas/StartingLiquidityMonthResult'
      required:
      - months
      - required_amount
    StatelessFinancialMonthRequest:
      type: object
      properties:
        year:
          type: integer
        month:
          type: integer
          maximum: 12
          minimum: 1
        gross_income:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        usable_income:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        existing_costs:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - existing_costs
      - gross_income
      - month
      - usable_income
      - year
    StatelessHousingTestRequestRequest:
      type: object
      properties:
        property_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        deposit:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        financing_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,3})?$
        tenure_years:
          type: integer
          minimum: 1
        known_monthly_payment:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        additional_costs:
          type: array
          items:
            $ref: '#/components/schemas/HousingCalculationCostRequest'
        cash_on_hand:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          default: '0.00'
        upfront_costs:
          type: array
          items:
            $ref: '#/components/schemas/HousingCalculationCostRequest'
        financial_months:
          type: array
          items:
            $ref: '#/components/schemas/StatelessFinancialMonthRequest'
        tested_monthly_home_cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        income_shock_percent:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          default: '0.00'
      required:
      - deposit
      - financing_rate
      - property_price
      - tenure_years
    StatusEnum:
      enum:
      - preview
      - confirmed
      type: string
      description: |-
        * `preview` - Awaiting confirmation
        * `confirmed` - Confirmed
    WorkCostBasisEnum:
      enum:
      - recorded_entries_by_month
      type: string
      description: '* `recorded_entries_by_month` - recorded_entries_by_month'
    WorkCostEntry:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        category_id:
          type: integer
          readOnly: true
        category_name:
          type: string
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - category_id
      - category_name
      - created_at
      - date
      - id
      - updated_at
    WorkCostEntryWriteRequest:
      type: object
      properties:
        category_id:
          type: integer
          minimum: 1
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        date:
          type: string
          format: date
      required:
      - amount
      - category_id
      - date
    WorkCostItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          oneOf:
          - type: string
            maxLength: 40
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
        name:
          type: string
          maxLength: 120
        is_custom:
          type: boolean
        is_active:
          type: boolean
        legacy_monthly_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - id
      - legacy_monthly_amount
      - name
    WorkCostItemCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
      required:
      - name
    WorkCostMonthSummary:
      type: object
      properties:
        month:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
        income_recorded:
          type: boolean
        gross_income:
          type: string
          format: decimal
        work_cost_total:
          type: string
          format: decimal
        income_after_work_costs:
          type: string
          format: decimal
          nullable: true
        available_months:
          type: array
          items:
            type: string
            pattern: ^\d{4}-(0[1-9]|1[0-2])$
      required:
      - available_months
      - gross_income
      - income_after_work_costs
      - income_recorded
      - month
      - work_cost_total
