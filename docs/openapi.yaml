          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedHousingScenarioRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedHousingScenarioRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HousingScenario'
          description: ''
    delete:
      operationId: housing_scenarios_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this housing scenario.
        required: true
      tags:
      - housing
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/housing/test/:
