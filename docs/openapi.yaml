      operationId: housing_scenarios_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this housing scenario.
        required: true
      tags:
      - housing
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
