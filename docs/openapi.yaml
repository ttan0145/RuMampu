          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/HousingScenarioRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HousingScenarioRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HousingScenario'
          description: ''
    patch:
      operationId: housing_scenarios_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this housing scenario.
        required: true
