          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWorkCostEntryWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedWorkCostEntryWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedWorkCostEntryWriteRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkCostEntry'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/work-costs/summary/:
    get:
      operationId: work_cost_month_summary
      summary: Calculate income after work costs for one recorded month
      parameters:
      - in: query
        name: month
        schema:
          type: string
          minLength: 1
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
      tags:
      - Work costs
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkCostMonthSummary'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
components:
  schemas:
    AnswerEnum:
      enum:
      - 'yes'
      - 'no'
      - not_sure
      type: string
      description: |-
        * `yes` - Yes
        * `no` - No
        * `not_sure` - Not sure
    ApiError:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ApiErrorBody'
      required:
      - error
    ApiErrorBody:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        fields: {}
        context: {}
      required:
      - code
      - message
    BasisEnum:
      enum:
      - recorded_minimum
      type: string
      description: '* `recorded_minimum` - recorded_minimum'
    CarryingRangeResult:
      type: object
      properties:
        lower_monthly_amount:
          type: number
          format: double
        upper_monthly_amount:
          type: number
          format: double
        tested_monthly_home_cost:
          type: number
          format: double
          minimum: 0
        lower_meaning:
          type: string
        upper_meaning:
          type: string
        indicative_property_price_lower:
          type: number
          format: double
          minimum: 0
        indicative_property_price_upper:
          type: number
          format: double
          minimum: 0
        property_price_limitation:
          type: string
      required:
      - indicative_property_price_lower
      - indicative_property_price_upper
      - lower_meaning
      - lower_monthly_amount
      - property_price_limitation
      - tested_monthly_home_cost
      - upper_meaning
      - upper_monthly_amount
    CommitmentItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        commitment_type:
          $ref: '#/components/schemas/CommitmentTypeEnum'
        slug:
          type: string
          maxLength: 40
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 120
        monthly_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        is_daily_variable:
          type: boolean
        is_active:
          type: boolean
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - commitment_type
      - id
      - monthly_amount
      - name
      - slug
      - updated_at
    CommitmentTypeEnum:
      enum:
      - living
      - debt
      - savings
      type: string
      description: |-
