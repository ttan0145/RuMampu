# Grafana for RuMampu (local). Folder paths are set by ../start.sh through GF_PATHS_* variables.
[server]
http_addr = 127.0.0.1
http_port = 3000

[security]
admin_user = admin
disable_gravatar = true

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[users]
allow_sign_up = false

[auth.anonymous]
enabled = false

[news]
news_feed_enabled = false

[dashboards]
default_home_dashboard_path = ${RUMAMPU_MONITORING_DIR}/grafana/dashboards/api-health.json
