# Prometheus for RuMampu (local). Started by ../start.sh.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # uptime and response time of the app, from the probe service
  - job_name: rumampu_probe
    static_configs:
      - targets: ["127.0.0.1:9115"]

  # Prometheus watching itself
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
